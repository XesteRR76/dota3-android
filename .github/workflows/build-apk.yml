name: Build Dota 3 Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Dota 3 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 Platform & Build Tools
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Signing Keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/release.keystore \
            -storepass dota3release -alias dota3key -keypass dota3release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dota3,O=Antigravity,C=US"

      - name: Run Unit Tests & Build APKs
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Package APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dota3-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/dota3-release.apk
          ls -lh dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dota3-android-apks
          path: dist/

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dota3-release.apk
            dist/dota3-debug.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
