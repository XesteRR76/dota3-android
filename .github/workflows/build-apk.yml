name: Build Dota 3 Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Dota 3 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Persistent Signing Keystores
        env:
          RELEASE_KS_B64: ${{ secrets.DOTA3_RELEASE_KEYSTORE_B64 }}
          DEBUG_KS_B64: ${{ secrets.DOTA3_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore "$HOME/.android"
          if [ -n "$RELEASE_KS_B64" ]; then
            echo "$RELEASE_KS_B64" | base64 -d > keystore/release.keystore
            echo "Restored persistent release keystore from secret."
          else
            keytool -genkeypair -v -keystore keystore/release.keystore \
              -storepass dota3release -alias dota3key -keypass dota3release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Dota3,O=Antigravity,C=US"
          fi
          keytool -list -keystore keystore/release.keystore -storepass dota3release -alias dota3key
          if [ -n "$DEBUG_KS_B64" ]; then
            echo "$DEBUG_KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored persistent debug keystore from secret."
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          fi

      - name: Run Unit Tests & Build APKs
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Package & Verify Signed APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dota3-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/dota3-release.apk
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_DIR/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs dist/dota3-release.apk
          "$APKSIGNER" verify --print-certs dist/dota3-debug.apk
          ls -lh dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dota3-android-apks
          path: dist/

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dota3-release.apk
            dist/dota3-debug.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
